name: Build Unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Swift Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/Enchanted-*/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache Derived Data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/Enchanted-*
          key: ${{ runner.os }}-derived-${{ hashFiles('**/*.swift') }}-${{ hashFiles('**/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-derived-

      - name: Add Localization to Project
        run: |
          # Install xcodeproj gem and add localization
          gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            project_path = "Enchanted.xcodeproj"
            project = Xcodeproj::Project.open(project_path)

            # Find or create localization group
            main_group = project.main_group
            lproj_group = main_group.groups.find { |g| g.name == "Localizable" }
            unless lproj_group
              lproj_group = main_group.new_group("Localizable", "Localizable")
            end

            # Add zh-Hant localization
            zh_hant_path = "zh-Hant.lproj/Localizable.strings"
            unless lproj_group.files.find { |f| f.path == zh_hant_path }
              file_ref = lproj_group.new_file(zh_hant_path)
              file_ref.last_known_file_type = "text.plist.strings"

              # Add to resources build phase
              target = project.targets.first
              target.resources_build_phase.add_file_reference(file_ref)
            end

            # Add known region
            project.attributes["knownRegions"] = ["en", "zh-Hant", "Base"] unless project.attributes["knownRegions"]&.include?("zh-Hant")

            project.save
            print "Localization added successfully"
          ' || echo "Warning: Could not add localization (xcodeproj gem may not be available)"

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Enchanted.xcodeproj \
            -scheme Enchanted \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Enchanted.xcarchive \
            -clonedSourcePackagesDirPath ~/Library/Developer/Xcode/DerivedData/Enchanted-*/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual

      - name: Create Unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/Enchanted.xcarchive/Products/Applications/Enchanted.app build/ipa/Payload/
          cd build/ipa
          zip -r ../Enchanted-unsigned.ipa Payload
          cd ../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Enchanted-unsigned.ipa
          path: build/Enchanted-unsigned.ipa
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Unsigned IPA build from main branch.
            Built with Xcode on macOS runner.

            **Note:** This is an unsigned build. You'll need to sideload it using AltStore, Sideloadly, or similar tools.
          files: build/Enchanted-unsigned.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
