name: Build Unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Enchanted.xcodeproj \
            -scheme Enchanted \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Enchanted.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual

      - name: Create Unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/Enchanted.xcarchive/Products/Applications/Enchanted.app build/ipa/Payload/
          cd build/ipa
          zip -r ../Enchanted-unsigned.ipa Payload
          cd ../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Enchanted-unsigned.ipa
          path: build/Enchanted-unsigned.ipa
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Unsigned IPA build from main branch.
            Built with Xcode on macOS runner.

            **Note:** This is an unsigned build. You'll need to sideload it using AltStore, Sideloadly, or similar tools.
          files: build/Enchanted-unsigned.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
